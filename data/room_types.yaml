# Catálogo de tipos de cômodo — fonte única de zona, passagem, atributos e mínimos (DEC-0074).
# Unidades: largura em mm; áreas em m². Cada valor numérico cita uma fonte de data/sources.yaml em `sources`.
# Perfil padrão: "piso nacional" = o mais exigente entre NBR 15575-1 (anexo) e MCMV quando ambos existem.
# Não há área mínima nacional por cômodo (a NBR não fixa): `min_area_m2` só existe quando há fonte;
# `comfort_area_m2` alimenta a área-alvo do gerador. Pesquisa: docs/research/Dados de referência para plantas.md
